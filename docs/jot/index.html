---
layout: null
sitemap: false
---
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>jot</title>
<style>
:root{--bg:#f5f7f9;--ink:#1c2228;--mute:#5c6770;--line:#dde3e8;--acc:#0b6e74;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:1rem}
header{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem}header h1{font-size:1.1rem;margin:0;color:var(--acc)}header .sp{flex:1}
button{font:inherit;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:6px;padding:.4rem .9rem;cursor:pointer}button.alt{background:#fff;color:var(--acc)}button.danger{background:#fff;color:#b23;border-color:#b23}button:disabled{opacity:.5}
input,textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:8px;padding:.6rem .7rem;background:var(--card);color:var(--ink)}
textarea{min-height:46vh;resize:vertical;line-height:1.5;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:1rem}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.row .sp{flex:1}
.list{list-style:none;padding:0;margin:0}.list li{display:flex;gap:.8rem;padding:.55rem .2rem;border-bottom:1px dashed var(--line);cursor:pointer}.list li:hover{background:#eef3f3}
.list .d{flex:0 0 8.5rem;color:var(--mute);font-size:.85rem}.list .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg{color:var(--mute);font-size:.9rem;min-height:1.2em}.err{color:#b23}
small.k{color:var(--mute);font-size:.8rem}
#login input{margin:.4rem 0}
</style></head><body><div class="wrap">
<header><h1>jot</h1><span class="msg" id="msg"></span><span class="sp"></span><button class="alt" id="newBtn" hidden>New</button><button class="alt" id="logout" hidden>Log out</button></header>

<section id="login" class="card">
  <label>API <input id="api" placeholder="https://jot.<subdomain>.workers.dev"></label>
  <label>Password <input id="pw" type="password" autocomplete="current-password"></label>
  <div class="row"><button id="loginBtn">Log in</button><small class="k">Session lasts 30 days on this device.</small></div>
</section>

<section id="editor" class="card" hidden>
  <textarea id="text" placeholder="Write… (first line becomes the title)  ·  Ctrl/⌘+Enter to save"></textarea>
  <div class="row" style="margin-top:.6rem"><button id="save">Save</button><button class="alt" id="cancel">Close</button><span class="sp"></span><button class="danger" id="del" hidden>Delete</button></div>
  <small class="k" id="meta"></small>
</section>

<section id="notes" class="card" hidden>
  <div class="row"><strong>Notes</strong><span class="sp"></span><button class="alt" id="refresh">Refresh</button></div>
  <ul class="list" id="list"></ul>
</section>
</div>
<script>
const DEFAULT_API = 'https://jot.REPLACE-ME.workers.dev';
const $ = s => document.querySelector(s);
const st = { api: localStorage.getItem('jot.api') || DEFAULT_API, token: localStorage.getItem('jot.token') || '', cur: null };
$('#api').value = st.api;
const msg = (t, err) => { const m = $('#msg'); m.textContent = t || ''; m.className = 'msg' + (err ? ' err' : ''); };
async function call(path, opt = {}) {
  const r = await fetch(st.api.replace(/\/+$/, '') + path, { ...opt, headers: { 'Content-Type': 'application/json', ...(st.token ? { Authorization: 'Bearer ' + st.token } : {}), ...(opt.headers || {}) } });
  if (r.status === 401 && path !== '/login') { logout(); throw new Error('session expired — log in again'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
  return data;
}
function show(authed) { $('#login').hidden = authed; $('#notes').hidden = !authed; $('#newBtn').hidden = !authed; $('#logout').hidden = !authed; if (!authed) $('#editor').hidden = true; }
function logout() { st.token = ''; localStorage.removeItem('jot.token'); show(false); }
async function login() {
  st.api = $('#api').value.trim(); localStorage.setItem('jot.api', st.api); msg('logging in…');
  try { const d = await call('/login', { method: 'POST', body: JSON.stringify({ password: $('#pw').value }) });
    st.token = d.token; localStorage.setItem('jot.token', d.token); $('#pw').value = ''; show(true); msg(''); await list(); openNew(); }
  catch (e) { msg(e.message, true); }
}
async function list() {
  msg('loading…'); const { notes } = await call('/notes?limit=100'); msg('');
  const ul = $('#list'); ul.innerHTML = '';
  for (const n of notes) { const li = document.createElement('li'); const d = new Date(n.updated || n.created);
    li.innerHTML = `<span class="d">${d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span><span class="t"></span>`;
    li.querySelector('.t').textContent = n.title || '(untitled)'; li.onclick = () => open(n.id); ul.appendChild(li); }
  if (!notes.length) ul.innerHTML = '<li><span class="d">—</span><span class="t">no notes yet</span></li>';
}
function openNew() { st.cur = null; $('#text').value = ''; $('#meta').textContent = ''; $('#del').hidden = true; $('#editor').hidden = false; $('#text').focus(); }
async function open(id) { msg('opening…'); const n = await call('/notes/' + id); msg(''); st.cur = id; $('#text').value = n.text; $('#meta').textContent = `created ${new Date(n.created).toLocaleString()} · updated ${new Date(n.updated).toLocaleString()}`; $('#del').hidden = false; $('#editor').hidden = false; $('#text').focus(); }
async function save() {
  const text = $('#text').value; if (!text.trim()) return; $('#save').disabled = true; msg('saving…');
  try { if (st.cur) await call('/notes/' + st.cur, { method: 'PUT', body: JSON.stringify({ text }) }); else { const d = await call('/notes', { method: 'POST', body: JSON.stringify({ text }) }); st.cur = d.id; $('#del').hidden = false; }
    msg('saved ' + new Date().toLocaleTimeString()); await list(); } catch (e) { msg(e.message, true); } finally { $('#save').disabled = false; }
}
async function del() { if (!st.cur || !confirm('Delete this note?')) return; try { await call('/notes/' + st.cur, { method: 'DELETE' }); openNew(); await list(); msg('deleted'); } catch (e) { msg(e.message, true); } }
$('#loginBtn').onclick = login; $('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('#logout').onclick = logout; $('#newBtn').onclick = openNew; $('#save').onclick = save; $('#del').onclick = del; $('#refresh').onclick = () => list().catch(e => msg(e.message, true));
$('#cancel').onclick = () => { $('#editor').hidden = true; };
$('#text').addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); save(); } });
window.addEventListener('beforeunload', e => { if (!$('#editor').hidden && $('#text').value.trim() && st.cur === null) { e.preventDefault(); e.returnValue = ''; } });
(async () => { if (!st.token) return show(false); try { await call('/me'); show(true); await list(); } catch (e) { show(false); msg(e.message, true); } })();
</script></body></html>
